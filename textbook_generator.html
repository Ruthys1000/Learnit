<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מחולל ספרי לימוד דיגיטליים</title>
<style>
  :root{
    --bg:#eef2f9; --panel:#ffffff; --ink:#16202e; --muted:#5b6779; --line:#dbe3ef;
    --brand:#2563eb; --brand-soft:#e8f1ff; --brand-ink:#1d4ed8; --danger:#dc2626;
    --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
    --shadow:0 16px 40px rgba(20,30,55,.12); --radius:14px;
  }
  :root[data-theme="dark"]{
    --bg:#0d1320; --panel:#141c2b; --ink:#e9eefb; --muted:#9aa7bd; --line:#28344a;
    --brand:#4f8cff; --brand-soft:#182339; --brand-ink:#8fb6ff; --danger:#f87171;
    --ok:#4ade80; --ok-soft:#0f2a1c; --warn:#fbbf24; --warn-soft:#2a2210;
    --shadow:0 16px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Heebo','Assistant','Segoe UI',Arial,sans-serif;
    line-height:1.5;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .top{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px}
  .logo .m{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),#7c3aed);color:#fff;font-size:17px}
  .grow{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
    padding:8px 13px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:transform .12s,border-color .2s,background .2s}
  .btn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.icon{padding:8px;width:36px;height:36px;justify-content:center}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  label.filebtn{position:relative;overflow:hidden}
  label.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
  .sep{width:1px;height:26px;background:var(--line);margin:0 3px}

  .main{flex:1;display:grid;grid-template-columns:minmax(340px,44%) 1fr;min-height:0}
  .side{display:flex;flex-direction:column;min-width:0;border-inline-end:1px solid var(--line);background:var(--panel)}
  .tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
  .tab{border:1px solid transparent;border-bottom:none;background:transparent;color:var(--muted);
    padding:7px 13px;border-radius:10px 10px 0 0;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .tab.active{background:var(--bg);color:var(--ink);border-color:var(--line)}
  .tabpane{flex:1;min-height:0;overflow:auto;padding:12px;display:none;flex-direction:column;gap:10px}
  .tabpane.active{display:flex}

  textarea#src{flex:1;min-height:260px;width:100%;resize:none;border:1px solid var(--line);
    border-radius:12px;padding:12px 13px;background:var(--bg);color:var(--ink);
    font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;
    direction:rtl;unicode-bidi:plaintext}
  textarea#src:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}

  .hint{font-size:12.5px;color:var(--muted)}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px}
  .card h3{margin:0 0 8px;font-size:13.5px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
  .field label{font-size:12px;color:var(--muted);font-weight:700}
  .field input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel);
    color:var(--ink);font-family:inherit;font-size:13px}

  .struct{display:flex;flex-direction:column;gap:6px}
  .pageItem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;
    padding:7px 9px;background:var(--panel)}
  .pageItem .idx{width:22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);
    display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}
  .pageItem .nm{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pageItem .tag{font-size:10.5px;color:var(--muted);flex:none}

  .warnbox{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);
    border-radius:10px;padding:9px 11px;font-size:12.5px;display:none}
  .warnbox.show{display:block}
  .warnbox ul{margin:6px 0 0;padding-inline-start:18px}
  .assetlist{font-size:12px;color:var(--muted);max-height:140px;overflow:auto}
  .assetlist .miss{color:var(--danger);font-weight:700}
  .assetlist .ok{color:var(--ok)}

  .previewWrap{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .pvbar{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
  .pvbar .lbl{font-weight:800;font-size:12.5px;color:var(--muted)}
  .pvdot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  iframe#pv{flex:1;width:100%;border:0;background:#fff}

  .empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
  .empty .big{font-size:44px;margin-bottom:10px}

  /* prompt modal */
  .modal{position:fixed;inset:0;background:rgba(8,14,26,.55);display:none;place-items:center;z-index:50;padding:20px}
  .modal.show{display:grid}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;
    max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .sheet header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .sheet header h2{margin:0;font-size:16px;flex:1}
  .sheet .body{overflow:auto;padding:16px 18px}
  .sheet pre{white-space:pre-wrap;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.65;background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin:0;direction:rtl;unicode-bidi:plaintext}

  .toast{position:fixed;inset-inline-start:50%;bottom:24px;transform:translateX(50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:13px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
  .toast.show{opacity:1}

  @media (max-width:820px){
    .main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .side{border-inline-end:none;border-bottom:1px solid var(--line)}
  }
</style>
</head>

"use strict";

/* ============================================================
   הפרומפט המלא (סעיף 5 במסמך התכנון)
   ============================================================ */
const PROMPT_TEXT = `אתה עוזר ליצירת ספר לימוד דיגיטלי. המטרה שלך היא לא רק להעביר תוכן, אלא לעצב תהליך למידה: לבחור מתי להסביר, מתי לבדוק הבנה, מתי להעמיק, ומתי להסביר מונח חדש. כתוב את כל הספר בפורמט הבא בלבד, בלי הסברים מחוץ לפורמט.

### עקרונות פדגוגיים (חשובים לא פחות מהתחביר!)
- לא כל עמוד צריך שאלה. עמודי תוכן טהור, שמסבירים רעיון חדש בלי הפרעה, הם חלק לגיטימי ורצוי מהמבנה.
- הוסף שאלת הבנה [quiz] בסמוך למקום שבו רעיון מרכזי הושלם — כדי לבדוק שהלומד/ת קלטו אותו לפני שממשיכים.
- אם מושג דורש כמה עמודים כדי להתבסס, אפשר לדחות את הבדיקה לעמוד מאוחר יותר שמאחד כמה רעיונות יחד, במקום לבדוק כל פרט בנפרד.
- כשמופיע מונח מקצועי חדש בפעם הראשונה, סמן אותו כמונח מילון (כלל 6) כדי שאפשר יהיה ללחוץ ולראות הגדרה, במקום לעצור את זרימת הפסקה בהסבר ארוך.
- תוכן העשרה, דוגמה נוספת, או פרטים שלא כולם חייבים לקרוא — שים בקטע מתקפל (כלל 7), כדי שהעמוד הראשי יישאר קצר וממוקד.

### כללי הפורמט

1. מטא-דאטה בתחילת הקובץ:
TITLE: <כותרת הספר>
PASS: <ציון מעבר באחוזים, למשל 70>

2. מילון מונחים — בלוק אחד, מיד אחרי המטא-דאטה, לפני העמוד הראשון:
[glossary]
מונח ראשון: הגדרה קצרה וברורה
מונח שני: הגדרה קצרה וברורה
[/glossary]

3. כל עמוד מתחיל בשורה עם סולמית אחת וכותרת:
# כותרת העמוד

4. פסקה רגילה = טקסט חופשי. אפשר **הדגשה** ו*נטוי*.
תת-כותרת בתוך עמוד:
## תת-כותרת

5. כדי לסמן מילה כמונח מילון לחיץ, עטפו אותה בסוגריים מסולסלים כפולים, בדיוק כפי שהיא מופיעה במילון:
טקסט לפני {{מונח ראשון}} טקסט אחרי.

6. תמונה או וידאו — אותו תחביר, ההבדל נקבע לפי סיומת הקובץ:
![כיתוב](assets/שם_קובץ.jpg)
![כיתוב](assets/שם_קובץ.mp4)
סיומות תמונה: jpg, png, gif, webp, svg. סיומות וידאו: mp4, webm, mov.
חשוב מאוד: השתמשו רק בשמות קבצים מתוך רשימת "קבצי המדיה הזמינים" למטה. אל תמציאו קבצים. אם אין קובץ מתאים — אל תוסיפו תמונה/וידאו באותו מקום.

7. קטע מתקפל (תוכן העשרה אופציונלי):
[more: כותרת הקטע המתקפל]
תוכן שיוצג רק כשלוחצים על הכותרת.
[/more]

8. שאלת הערכה — שלושה סוגים, כל שאלה בין [quiz: ...] ל-[/quiz]:

בחירה יחידה (כוכבית לפני התשובה הנכונה, רק אחת):
[quiz: single]
Q: נוסח השאלה
- תשובה שגויה
- *תשובה נכונה
- תשובה שגויה
EXPLAIN: הסבר קצר לאחר מענה (אופציונלי)
[/quiz]

בחירה מרובה (כוכבית לפני כל תשובה נכונה, אפשר כמה):
[quiz: multi]
Q: נוסח השאלה
- *תשובה נכונה
- תשובה שגויה
- *תשובה נכונה
[/quiz]

אמת/שקר:
[quiz: truefalse]
Q: נוסח הקביעה
ANSWER: true
[/quiz]
(ANSWER יכול להיות רק true או false)

9. אין להשתמש בשום תחביר אחר (בלי טבלאות, בלי קישורים, בלי HTML גולמי).

### דוגמה לעמוד תקין

[glossary]
אידוי: תהליך שבו נוזל הופך לגז בהשפעת חום
עיבוי: תהליך שבו גז הופך לנוזל בהתקררות
[/glossary]

# מבוא למחזור המים

מחזור המים הוא התהליך שבו מים נעים בין האוקיינוס, האטמוספרה והיבשה. שלב מרכזי בתהליך נקרא {{אידוי}}, ושלב נוסף נקרא {{עיבוי}}.

![תרשים מחזור המים](assets/water_cycle_diagram.png)

[more: לרוצים להעמיק — מחזור המים בעולם החקלאות]
מחזור המים משפיע ישירות על תכנון השקיה בחקלאות מודרנית, ועל תחזיות בצורת ושיטפונות.
[/more]

[quiz: single]
Q: מהו {{אידוי}}?
- מים שיורדים כגשם
- *מים שהופכים לאדים בחום השמש
- מים שקופאים לקרח
EXPLAIN: אידוי הוא המעבר ממצב נוזלי לגזי בהשפעת חום.
[/quiz]

### פרטי המשימה

נושא הספר: ____
קהל יעד: ____
מספר עמודים רצוי: ____ (ברירת מחדל: 15)
קבצי מדיה זמינים (שם מדויק כפי שהוא בתיקייה, אחד בכל שורה):
____

חומר הגלם לכתיבת הספר (הדביקו כאן את התוכן/הסיכומים/הנקודות שיש לכסות):
____

כתוב כעת את כל הספר בפורמט שהוגדר למעלה, ורק אותו.`;

/* ============================================================
   קבועים
   ============================================================ */
const IMAGE_EXT = ['jpg','jpeg','png','gif','webp','svg','avif'];
const VIDEO_EXT = ['mp4','webm','mov','m4v','ogv'];
function mediaKind(src){
  const ext = (src.split('.').pop()||'').toLowerCase();
  if (VIDEO_EXT.includes(ext)) return 'video';
  if (IMAGE_EXT.includes(ext)) return 'image';
  return 'image';
}
function baseName(p){ return (p||'').split('/').pop().split('\\').pop(); }

/* ============================================================
   פרסר דטרמיניסטי: טקסט -> מודל
   ============================================================ */
function parseBook(text){
  const warnings = [];
  const raw = String(text||'').replace(/\r\n?/g,'\n');
  const lines = raw.split('\n');
  let i = 0;
  const book = { title:'', pass:70, glossary:[], pages:[] };

  // --- מטא-דאטה + מבוא (עד לבלוק הראשון) ---
  // נסרוק את כל השורות שלפני העמוד הראשון / המילון עבור TITLE ו-PASS
  let passSeen = false, titleSeen = false;

  function isPageStart(s){ return /^#\s+/.test(s) && !/^##/.test(s); }

  // מילון מונחים
  function parseGlossary(startIdx){
    let j = startIdx+1;
    while (j < lines.length && !/^\[\/glossary\]\s*$/.test(lines[j])){
      const ln = lines[j].trim();
      if (ln){
        const m = ln.match(/^(.+?)\s*:\s*(.+)$/);
        if (m) book.glossary.push({ term:m[1].trim(), definition:m[2].trim() });
        else warnings.push('שורה במילון ללא הפרדה "מונח: הגדרה": ' + ln);
      }
      j++;
    }
    if (j >= lines.length) warnings.push('בלוק [glossary] נפתח אך לא נסגר ב-[/glossary].');
    return j; // index of [/glossary] or end
  }

  // מעבר ראשוני: מטא-דאטה + מילון, עד תחילת העמוד הראשון
  while (i < lines.length){
    const ln = lines[i];
    const t = ln.trim();
    if (isPageStart(ln)) break;
    if (/^TITLE:/i.test(t)){ book.title = t.replace(/^TITLE:/i,'').trim(); titleSeen = true; i++; continue; }
    if (/^PASS:/i.test(t)){
      const v = parseInt(t.replace(/^PASS:/i,'').trim(),10);
      if (!isNaN(v)) book.pass = Math.max(0,Math.min(100,v));
      passSeen = true; i++; continue;
    }
    if (/^\[glossary\]\s*$/.test(t)){ i = parseGlossary(i) + 1; continue; }
    i++; // דלג על שורות ריקות/אחרות שלפני העמוד הראשון
  }
  if (!titleSeen) warnings.push('לא נמצאה שורת TITLE בראש הקובץ.');
  if (!passSeen) warnings.push('לא נמצאה שורת PASS — נעשה שימוש בברירת מחדל 70%.');

  // --- פרסור בלוקים בתוך עמוד ---
  // parseBlocks עובד על טווח שורות ומחזיר מערך בלוקים
  function parseBlocks(arr){
    const blocks = [];
    let k = 0;
    let para = [];
    function flushPara(){
      if (para.length){
        const txt = para.join(' ').replace(/\s+/g,' ').trim();
        if (txt) blocks.push({ type:'paragraph', text:txt });
        para = [];
      }
    }
    while (k < arr.length){
      const ln = arr[k];
      const t = ln.trim();

      if (t === ''){ flushPara(); k++; continue; }

      if (/^##\s+/.test(t)){ flushPara(); blocks.push({ type:'subheading', text:t.replace(/^##\s+/,'').trim() }); k++; continue; }

      const mMedia = t.match(/^!\[(.*?)\]\((.*?)\)\s*$/);
      if (mMedia){ flushPara(); blocks.push({ type:'media', kind:mediaKind(mMedia[2].trim()), src:mMedia[2].trim(), caption:mMedia[1].trim() }); k++; continue; }

      const mMore = t.match(/^\[more:\s*(.*?)\]\s*$/);
      if (mMore){
        flushPara();
        const inner = [];
        let j = k+1;
        while (j < arr.length && !/^\[\/more\]\s*$/.test(arr[j].trim())){ inner.push(arr[j]); j++; }
        if (j >= arr.length) warnings.push('בלוק [more] נפתח אך לא נסגר ב-[/more].');
        blocks.push({ type:'more', title:mMore[1].trim(), blocks:parseBlocks(inner) });
        k = j+1; continue;
      }

      const mQuiz = t.match(/^\[quiz:\s*(single|multi|truefalse)\s*\]\s*$/i);
      if (mQuiz){
        flushPara();
        const qType = mQuiz[1].toLowerCase();
        const inner = [];
        let j = k+1;
        while (j < arr.length && !/^\[\/quiz\]\s*$/.test(arr[j].trim())){ inner.push(arr[j]); j++; }
        if (j >= arr.length) warnings.push('בלוק [quiz] נפתח אך לא נסגר ב-[/quiz].');
        blocks.push(parseQuiz(qType, inner));
        k = j+1; continue;
      }

      if (/^\[\/(more|quiz|glossary)\]/.test(t)){ k++; continue; } // סוגר יתום — התעלם
      para.push(t);
      k++;
    }
    flushPara();
    return blocks;
  }

  function parseQuiz(qType, arr){
    const quiz = { type:'quiz', quizType:qType, question:'', options:[], answer:null, explain:'' };
    for (let a=0; a<arr.length; a++){
      const t = arr[a].trim();
      if (t === '') continue;
      if (/^Q:/i.test(t)){ quiz.question = t.replace(/^Q:/i,'').trim(); continue; }
      if (/^EXPLAIN:/i.test(t)){ quiz.explain = t.replace(/^EXPLAIN:/i,'').trim(); continue; }
      if (/^ANSWER:/i.test(t)){
        const v = t.replace(/^ANSWER:/i,'').trim().toLowerCase();
        quiz.answer = (v === 'true');
        continue;
      }
      const mOpt = t.match(/^-\s*(\*?)\s*(.+)$/);
      if (mOpt){ quiz.options.push({ text:mOpt[2].trim(), correct: mOpt[1] === '*' }); continue; }
    }
    // אימות
    if (!quiz.question) warnings.push('שאלון ללא שורת Q:.');
    if (qType === 'single'){
      const c = quiz.options.filter(o=>o.correct).length;
      if (c !== 1) warnings.push('שאלת בחירה יחידה צריכה בדיוק תשובה נכונה אחת (נמצאו ' + c + '): "' + quiz.question + '"');
    } else if (qType === 'multi'){
      const c = quiz.options.filter(o=>o.correct).length;
      if (c < 1) warnings.push('שאלת בחירה מרובה ללא תשובה נכונה מסומנת: "' + quiz.question + '"');
    } else if (qType === 'truefalse'){
      if (quiz.answer === null) warnings.push('שאלת אמת/שקר ללא ANSWER תקין (true/false): "' + quiz.question + '"');
    }
    return quiz;
  }

  // --- פיצול לעמודים ---
  while (i < lines.length){
    if (isPageStart(lines[i])){
      const title = lines[i].replace(/^#\s+/,'').trim();
      let j = i+1;
      while (j < lines.length && !isPageStart(lines[j])) j++;
      const body = lines.slice(i+1, j);
      book.pages.push({ title, blocks:parseBlocks(body) });
      i = j;
    } else { i++; }
  }

  if (book.pages.length === 0) warnings.push('לא נמצאו עמודים (שורה שמתחילה ב-"# ").');

  // הקצאת מזהי שאלון דטרמיניסטיים + ספירה
  let qid = 0;
  function assign(blocks){
    blocks.forEach(b=>{
      if (b.type === 'quiz') b._qid = 'q' + (qid++);
      else if (b.type === 'more') assign(b.blocks);
    });
  }
  book.pages.forEach(p=>assign(p.blocks));
  book.quizCount = qid;

  // אימות הפניות מילון + מדיה
  const terms = new Set(book.glossary.map(g=>g.term));
  book.mediaRefs = [];
  function scanRefs(blocks){
    blocks.forEach(b=>{
      if (b.type === 'paragraph' || b.type === 'subheading'){
        const re = /\{\{(.+?)\}\}/g; let m;
        while ((m = re.exec(b.text))){ if (!terms.has(m[1].trim())) warnings.push('הפניה למונח שאינו במילון: {{' + m[1].trim() + '}}'); }
      } else if (b.type === 'media'){ book.mediaRefs.push(b.src); }
      else if (b.type === 'more'){
        if (b.title){ const re=/\{\{(.+?)\}\}/g; let m; while((m=re.exec(b.title))){ if(!terms.has(m[1].trim())) warnings.push('הפניה למונח שאינו במילון: {{'+m[1].trim()+'}}'); } }
        scanRefs(b.blocks);
      } else if (b.type === 'quiz'){
        const chk = (s)=>{ const re=/\{\{(.+?)\}\}/g; let m; while((m=re.exec(s||''))){ if(!terms.has(m[1].trim())) warnings.push('הפניה למונח שאינו במילון: {{'+m[1].trim()+'}}'); } };
        chk(b.question); (b.options||[]).forEach(o=>chk(o.text)); chk(b.explain);
      }
    });
  }
  book.pages.forEach(p=>scanRefs(p.blocks));

  book.warnings = warnings;
  return book;
}

/* ============================================================
   מנוע הקורא — פונקציה עצמאית שמוזרקת גם לתצוגה וגם לייצוא.
   קוראת את window.__BOOK__ / __CFG__ / __ASSETS__.
   ============================================================ */
function READER_MAIN(){
  const BOOK = window.__BOOK__ || {pages:[],glossary:[],title:'',pass:70};
  const CFG  = window.__CFG__  || {};
  const ASSETS = window.__ASSETS__ || {};
  const mode = CFG.mode || 'standalone';
  const pass = typeof BOOK.pass === 'number' ? BOOK.pass : 70;

  const gloss = {};
  (BOOK.glossary||[]).forEach(g=>{ gloss[g.term] = g.definition; });

  // איסוף שאלונים לפי סדר
  const quizzes = [];
  (BOOK.pages||[]).forEach(p=>{
    (function walk(blocks){ (blocks||[]).forEach(b=>{ if(b.type==='quiz') quizzes.push(b); else if(b.type==='more') walk(b.blocks); }); })(p.blocks);
  });
  const totalQ = quizzes.length;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escAttr(s){ return esc(s); }

  function inlineFmt(s){
    let out = esc(s);
    out = out.replace(/\{\{(.+?)\}\}/g,(m,term)=>{
      const t = term.trim();
      if (Object.prototype.hasOwnProperty.call(gloss,t)){
        return '<button type="button" class="term" data-def="'+escAttr(gloss[t])+'" data-term="'+escAttr(t)+'">'+esc(t)+'</button>';
      }
      return esc(t);
    });
    out = out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g,'$1<em>$2</em>');
    return out;
  }

  function resolveAsset(src){
    const b = src.split('/').pop();
    if (ASSETS[b]) return ASSETS[b];
    return src;
  }

  // ---------- אחסון מקומי ----------
  const SKEY = 'tbg::' + (BOOK.title || 'book');
  let state = { page:0, read:[], answers:{} };
  try { const s = JSON.parse(localStorage.getItem(SKEY)||'null'); if (s && typeof s==='object'){ state = Object.assign(state,s); state.read = state.read||[]; state.answers = state.answers||{}; } } catch(e){}
  function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} }

  // ---------- SCORM 1.2 ----------
  let API = null;
  function findAPI(win){
    let n = 0;
    while (win && !win.API && win.parent && win.parent !== win && n < 10){ n++; win = win.parent; }
    return win && win.API ? win.API : null;
  }
  function getAPI(){
    let a = findAPI(window);
    if (!a && window.opener) a = findAPI(window.opener);
    return a;
  }
  let scormReady = false;
  function scormInit(){
    if (mode !== 'scorm') return;
    API = getAPI();
    if (!API) return;
    try {
      if (API.LMSInitialize('') === 'true' || API.LMSInitialize('') === true){}
      scormReady = true;
      const st = API.LMSGetValue('cmi.core.lesson_status');
      if (!st || st==='not attempted' || st==='') { API.LMSSetValue('cmi.core.lesson_status','incomplete'); }
      API.LMSCommit('');
    } catch(e){}
  }
  function scormReport(percent, passed, done){
    if (mode !== 'scorm' || !scormReady || !API) return;
    try {
      API.LMSSetValue('cmi.core.score.raw', String(percent));
      API.LMSSetValue('cmi.core.score.min', '0');
      API.LMSSetValue('cmi.core.score.max', '100');
      if (done) API.LMSSetValue('cmi.core.lesson_status', passed ? 'passed' : 'failed');
      else API.LMSSetValue('cmi.core.lesson_status', 'incomplete');
      API.LMSCommit('');
    } catch(e){}
  }
  function scormFinish(){ if (mode==='scorm' && scormReady && API){ try{ API.LMSFinish(''); }catch(e){} } }
  window.addEventListener('unload', scormFinish);
  window.addEventListener('beforeunload', function(){ scormFinish(); });

  // ---------- חישוב ציון ----------
  function grade(){
    let correct = 0;
    quizzes.forEach(q=>{
      const a = state.answers[q._qid];
      if (a && a.correct) correct++;
    });
    const percent = totalQ ? Math.round(correct/totalQ*100) : 100;
    return { correct, total:totalQ, percent, passed: percent >= pass };
  }

  // ---------- בניית DOM ----------
  const root = document.createElement('div');
  root.className = 'reader';
  root.innerHTML =
    '<aside class="sidebar" id="sidebar">'+
      '<div class="bk-title">'+esc(BOOK.title||'ספר לימוד')+'</div>'+
      '<nav class="toc" id="toc"></nav>'+
      '<div class="side-foot">'+
        (BOOK.glossary&&BOOK.glossary.length ? '<button type="button" class="gloss-link" id="glossBtn">📖 מילון מונחים</button>' : '')+
        '<div class="prog" id="prog"></div>'+
      '</div>'+
    '</aside>'+
    '<main class="content" id="content"><button type="button" class="menu-toggle" id="menuToggle">☰ תוכן</button><div id="page"></div></main>'+
    '<div class="popover" id="popover" hidden></div>'+
    '<div class="gmodal" id="gmodal" hidden><div class="gsheet"><header><h2>מילון מונחים</h2><button type="button" id="gclose">סגור</button></header><div class="gbody" id="gbody"></div></div></div>';
  document.body.appendChild(root);

  const tocEl = root.querySelector('#toc');
  const pageEl = root.querySelector('#page');
  const contentEl = root.querySelector('#content');
  const progEl = root.querySelector('#prog');
  const popEl = root.querySelector('#popover');

  const PAGES = BOOK.pages || [];
  const RESULTS_INDEX = PAGES.length;

  function buildTOC(){
    let html = '';
    PAGES.forEach((p,idx)=>{
      const done = state.read.indexOf(idx) >= 0;
      html += '<button type="button" class="toc-item" data-i="'+idx+'"><span class="dot'+(done?' done':'')+'"></span><span class="t">'+esc(p.title||('עמוד '+(idx+1)))+'</span></button>';
    });
    if (totalQ) html += '<button type="button" class="toc-item results" data-i="'+RESULTS_INDEX+'"><span class="dot"></span><span class="t">🏁 סיום וציון</span></button>';
    tocEl.innerHTML = html;
    tocEl.querySelectorAll('.toc-item').forEach(b=>{
      b.addEventListener('click',()=>{ go(parseInt(b.dataset.i,10)); closeMenu(); });
    });
  }

  function renderBlocks(blocks){
    let html = '';
    (blocks||[]).forEach(b=>{
      if (b.type==='subheading') html += '<h2 class="sub">'+inlineFmt(b.text)+'</h2>';
      else if (b.type==='paragraph') html += '<p>'+inlineFmt(b.text)+'</p>';
      else if (b.type==='media'){
        const url = resolveAsset(b.src);
        const cap = b.caption ? '<figcaption>'+esc(b.caption)+'</figcaption>' : '';
        if (b.kind==='video') html += '<figure><video src="'+escAttr(url)+'" controls playsinline preload="metadata"></video>'+cap+'</figure>';
        else html += '<figure><img src="'+escAttr(url)+'" alt="'+escAttr(b.caption||'')+'" loading="lazy">'+cap+'</figure>';
      }
      else if (b.type==='more'){
        html += '<details class="more"><summary>'+inlineFmt(b.title||'להעמקה')+'</summary><div class="more-body">'+renderBlocks(b.blocks)+'</div></details>';
      }
      else if (b.type==='quiz'){ html += renderQuiz(b); }
    });
    return html;
  }

  function renderQuiz(q){
    const id = q._qid;
    const ans = state.answers[id];
    const answered = !!ans;
    let opts = '';
    if (q.quizType==='truefalse'){
      const choices = [{v:true,label:'נכון'},{v:false,label:'לא נכון'}];
      opts = '<div class="tf">'+choices.map(c=>{
        const sel = answered && ans.value===c.v;
        let cls='tf-btn';
        if (answered){ if (c.v===q.answer) cls+=' correct'; else if (sel) cls+=' wrong'; }
        return '<button type="button" class="'+cls+'" data-v="'+c.v+'"'+(answered?' disabled':'')+'>'+esc(c.label)+'</button>';
      }).join('')+'</div>';
    } else {
      const multi = q.quizType==='multi';
      opts = '<div class="opts">'+q.options.map((o,oi)=>{
        const selArr = answered ? (ans.value||[]) : [];
        const sel = selArr.indexOf(oi)>=0;
        let cls='opt';
        if (answered){ if (o.correct) cls+=' correct'; else if (sel) cls+=' wrong'; }
        const box = multi ? '<span class="box">'+(sel?'✓':'')+'</span>' : '<span class="radio'+(sel?' on':'')+'"></span>';
        return '<button type="button" class="'+cls+'" data-oi="'+oi+'"'+(answered?' disabled':'')+'>'+box+'<span class="otext">'+inlineFmt(o.text)+'</span></button>';
      }).join('')+'</div>';
    }
    let feedback = '';
    if (answered){
      feedback = '<div class="fb '+(ans.correct?'ok':'no')+'">'+(ans.correct?'✓ תשובה נכונה':'✗ תשובה לא נכונה')+
        (q.explain?'<div class="ex">'+inlineFmt(q.explain)+'</div>':'')+'</div>';
    }
    const typeLabel = q.quizType==='multi' ? 'בחירה מרובה — סמנו את כל הנכונות' : (q.quizType==='truefalse'?'אמת / שקר':'בחירה יחידה');
    const checkBtn = answered ? '' : '<button type="button" class="check" data-qid="'+id+'">בדיקת תשובה</button>';
    return '<section class="quiz" data-qid="'+id+'" data-type="'+q.quizType+'">'+
      '<div class="qhead"><span class="qbadge">שאלת הבנה</span><span class="qtype">'+typeLabel+'</span></div>'+
      '<div class="qtext">'+inlineFmt(q.question)+'</div>'+opts+checkBtn+feedback+'</section>';
  }

  // מצב בחירה זמני לפני "בדיקת תשובה"
  const pending = {}; // qid -> value (index/array/bool)

  function bindQuiz(sectionEl, q){
    const id = q._qid;
    if (state.answers[id]) return;
    if (q.quizType==='truefalse'){
      sectionEl.querySelectorAll('.tf-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          pending[id] = (btn.dataset.v==='true');
          sectionEl.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('sel'));
          btn.classList.add('sel');
        });
      });
    } else {
      const multi = q.quizType==='multi';
      sectionEl.querySelectorAll('.opt').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const oi = parseInt(btn.dataset.oi,10);
          if (multi){
            let arr = pending[id]||[];
            const p = arr.indexOf(oi);
            if (p>=0) arr.splice(p,1); else arr.push(oi);
            pending[id]=arr;
            btn.classList.toggle('sel');
            const box = btn.querySelector('.box'); if (box) box.textContent = arr.indexOf(oi)>=0 ? '✓' : '';
          } else {
            pending[id]=[oi];
            sectionEl.querySelectorAll('.opt').forEach(x=>{ x.classList.remove('sel'); const r=x.querySelector('.radio'); if(r) r.classList.remove('on'); });
            btn.classList.add('sel'); const r=btn.querySelector('.radio'); if(r) r.classList.add('on');
          }
        });
      });
    }
    const chk = sectionEl.querySelector('.check');
    if (chk) chk.addEventListener('click',()=>{
      const val = pending[id];
      if (q.quizType==='truefalse'){
        if (val===undefined){ flash(chk,'בחרו תשובה'); return; }
        const correct = (val===q.answer);
        state.answers[id]={ value:val, correct };
      } else if (q.quizType==='multi'){
        if (!val || !val.length){ flash(chk,'בחרו לפחות תשובה אחת'); return; }
        const correctSet = q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0).sort().join(',');
        const chosen = val.slice().sort((a,b)=>a-b).join(',');
        state.answers[id]={ value:val, correct: correctSet===chosen };
      } else {
        if (!val || !val.length){ flash(chk,'בחרו תשובה'); return; }
        const correct = q.options[val[0]] && q.options[val[0]].correct;
        state.answers[id]={ value:val, correct: !!correct };
      }
      save();
      // רינדור מחדש של השאלון בלבד
      const fresh = document.createElement('div');
      fresh.innerHTML = renderQuiz(q);
      const node = fresh.firstElementChild;
      sectionEl.replaceWith(node);
      afterQuizRender(node,q);
      const g = grade();
      scormReport(g.percent, g.passed, false);
      updateProg();
    });
  }

  function afterQuizRender(node,q){
    node.querySelectorAll('.term').forEach(bindTerm);
  }

  function flash(btn,msg){
    const old = btn.textContent; btn.textContent = msg; btn.classList.add('flash');
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove('flash'); }, 1400);
  }

  function bindTerm(btn){
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      showPopover(btn, btn.dataset.term, btn.dataset.def);
    });
  }
  function showPopover(anchor, term, def){
    popEl.innerHTML = '<strong>'+esc(term)+'</strong><span>'+esc(def)+'</span>';
    popEl.hidden = false;
    const r = anchor.getBoundingClientRect();
    const pr = popEl.getBoundingClientRect();
    let top = r.bottom + 8 + window.scrollY;
    let left = r.left + window.scrollX;
    if (left + pr.width > window.innerWidth - 12) left = window.innerWidth - pr.width - 12;
    if (left < 12) left = 12;
    popEl.style.top = top+'px';
    popEl.style.left = left+'px';
  }
  document.addEventListener('click',()=>{ popEl.hidden = true; });

  function updateProg(){
    const g = grade();
    const readN = state.read.length;
    let txt = 'התקדמות: '+readN+'/'+PAGES.length+' עמודים';
    if (totalQ) txt += ' · ציון: '+g.percent+'%';
    progEl.textContent = txt;
  }

  function markRead(idx){
    if (idx>=0 && idx<PAGES.length && state.read.indexOf(idx)<0){ state.read.push(idx); save(); buildTOC(); }
  }

  function go(idx){
    state.page = idx; save();
    render();
    contentEl.scrollTop = 0;
  }

  function renderResults(){
    const g = grade();
    let list = '';
    if (totalQ){
      quizzes.forEach((q,i)=>{
        const a = state.answers[q._qid];
        const stat = a ? (a.correct?'<span class="r-ok">✓</span>':'<span class="r-no">✗</span>') : '<span class="r-un">—</span>';
        list += '<li>'+stat+'<span>שאלה '+(i+1)+': '+esc((q.question||'').replace(/\{\{|\}\}/g,''))+'</span></li>';
      });
    }
    const ring = g.passed ? 'pass' : 'fail';
    pageEl.innerHTML =
      '<div class="results">'+
        '<h1>סיכום וציון</h1>'+
        (totalQ ?
          '<div class="score-ring '+ring+'"><div class="pct">'+g.percent+'%</div><div class="sub">'+g.correct+' מתוך '+g.total+' נכון</div></div>'+
          '<div class="verdict '+ring+'">'+(g.passed?'🎉 עברת! (ציון מעבר: '+pass+'%)':'לא עברת הפעם. ציון המעבר הוא '+pass+'%.')+'</div>'+
          '<ul class="qsum">'+list+'</ul>'+
          '<button type="button" class="retake" id="retake">התחלה מחדש של השאלונים</button>'
          :
          '<p class="noquiz">ספר זה אינו כולל שאלוני הערכה.</p>')+
      '</div>';
    const rt = pageEl.querySelector('#retake');
    if (rt) rt.addEventListener('click',()=>{ state.answers={}; save(); scormReport(0,false,false); go(0); });
    scormReport(g.percent, g.passed, true);
  }

  function render(){
    buildTOC();
    updateProg();
    // סמן פריט TOC פעיל
    tocEl.querySelectorAll('.toc-item').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.i,10)===state.page));

    if (state.page >= RESULTS_INDEX && totalQ){ renderResults(); return; }
    if (state.page < 0) state.page = 0;
    if (state.page >= PAGES.length) state.page = PAGES.length-1;
    if (PAGES.length===0){ pageEl.innerHTML = '<div class="results"><p class="noquiz">אין תוכן להצגה.</p></div>'; return; }

    const p = PAGES[state.page];
    let nav = '<div class="pagenav">';
    nav += state.page>0 ? '<button type="button" class="nav prev" id="navPrev">→ הקודם</button>' : '<span></span>';
    const isLast = state.page===PAGES.length-1;
    if (isLast && totalQ) nav += '<button type="button" class="nav next primary" id="navNext">סיום וציון 🏁</button>';
    else if (!isLast) nav += '<button type="button" class="nav next primary" id="navNext">הבא ←</button>';
    else nav += '<span></span>';
    nav += '</div>';

    pageEl.innerHTML = '<article class="page"><h1>'+esc(p.title||'')+'</h1>'+renderBlocks(p.blocks)+'</article>'+nav;

    markRead(state.page);

    // חיווט
    pageEl.querySelectorAll('.quiz').forEach(sec=>{
      const qid = sec.dataset.qid;
      const q = quizzes.find(x=>x._qid===qid);
      if (q){ if (state.answers[qid]) afterQuizRender(sec,q); else bindQuiz(sec,q); }
    });
    pageEl.querySelectorAll('.term').forEach(bindTerm);
    const np = pageEl.querySelector('#navPrev'); if (np) np.addEventListener('click',()=>go(state.page-1));
    const nn = pageEl.querySelector('#navNext'); if (nn) nn.addEventListener('click',()=>go(state.page+1));
  }

  // מילון מודאלי
  const gmodal = root.querySelector('#gmodal');
  const glossBtn = root.querySelector('#glossBtn');
  if (glossBtn){
    glossBtn.addEventListener('click',()=>{
      const gb = root.querySelector('#gbody');
      gb.innerHTML = (BOOK.glossary||[]).map(g=>'<div class="grow"><dt>'+esc(g.term)+'</dt><dd>'+esc(g.definition)+'</dd></div>').join('');
      gmodal.hidden = false;
    });
    root.querySelector('#gclose').addEventListener('click',()=>{ gmodal.hidden = true; });
    gmodal.addEventListener('click',(e)=>{ if (e.target===gmodal) gmodal.hidden = true; });
  }

  // תפריט צד נייד
  const menuToggle = root.querySelector('#menuToggle');
  const sidebar = root.querySelector('#sidebar');
  function closeMenu(){ sidebar.classList.remove('open'); }
  if (menuToggle) menuToggle.addEventListener('click',()=>{ sidebar.classList.toggle('open'); });

  scormInit();
  render();
}

/* ============================================================
   בניית מסמך הקורא (תצוגה + ייצוא)
   ============================================================ */
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildReaderDoc(model, opts){
  opts = opts || {};
  const cfg = { mode: opts.mode || 'standalone' };
  const assets = opts.assets || {};
  const data = '<script>window.__BOOK__=' + JSON.stringify(model) +
               ';window.__CFG__=' + JSON.stringify(cfg) +
               ';window.__ASSETS__=' + JSON.stringify(assets) + ';<\/script>';
  const run = '<script>(' + READER_MAIN.toString() + ')();<\/script>';
  return '<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
    '<title>' + escHtml(model.title || 'ספר לימוד דיגיטלי') + '</title>' +
    '<style>' + READER_CSS + '</style></head><body>' + data + run + '</body></html>';
}

/* ============================================================
   מצב האפליקציה
   ============================================================ */
const state = {
  assets: {},      // basename -> {file, url}
  assetsChosen: false,
  model: null
};

const $ = sel => document.querySelector(sel);
const srcEl = $('#src');
const pvEl = $('#pv');
const pvEmpty = $('#pvEmpty');

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- רינדור התצוגה ---------- */
let renderTimer = null;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 250); }

function currentAssetMap(){
  const m = {};
  for (const k in state.assets) m[k] = state.assets[k].url;
  return m;
}

function renderAll(){
  const text = srcEl.value;
  const hasText = text.trim().length > 0;
  const model = parseBook(text);
  state.model = model;

  // תצוגה מקדימה
  if (hasText && model.pages.length){
    pvEmpty.style.display = 'none';
    pvEl.style.display = 'block';
    pvEl.srcdoc = buildReaderDoc(model, { mode:'preview', assets: currentAssetMap() });
  } else {
    pvEl.style.display = 'none';
    pvEmpty.style.display = 'grid';
  }

  // אזהרות
  const wb = $('#warns');
  if (model.warnings && model.warnings.length){
    wb.classList.add('show');
    const uniq = [...new Set(model.warnings)];
    wb.innerHTML = '<strong>⚠️ ' + uniq.length + ' הערות פרסור:</strong><ul>' +
      uniq.slice(0,20).map(w=>'<li>'+escHtml(w)+'</li>').join('') +
      (uniq.length>20 ? '<li>ועוד '+(uniq.length-20)+'…</li>' : '') + '</ul>';
  } else { wb.classList.remove('show'); wb.innerHTML=''; }

  // פרטי ספר
  $('#fTitle').value = model.title || '';
  $('#fPass').value = model.pass;

  // מבנה עמודים
  renderStruct(model);
  // מדיה
  renderAssetStatus(model);

  // כפתורים
  const ready = hasText && model.pages.length>0;
  $('#btnDownload').disabled = !hasText;
  $('#btnSite').disabled = !ready;
  $('#btnScorm').disabled = !ready;
}

function renderStruct(model){
  $('#pageCount').textContent = model.pages.length ? '(' + model.pages.length + ')' : '';
  const list = $('#structList');
  if (!model.pages.length){ list.innerHTML = '<div class="hint">אין עמודים עדיין.</div>'; return; }
  list.innerHTML = model.pages.map((p,i)=>{
    let nq=0; (function w(b){ (b||[]).forEach(x=>{ if(x.type==='quiz')nq++; else if(x.type==='more')w(x.blocks); }); })(p.blocks);
    const tag = nq ? nq+' שאלות' : 'תוכן';
    return '<div class="pageItem"><span class="idx">'+(i+1)+'</span>'+
      '<span class="nm" title="'+escHtml(p.title)+'">'+escHtml(p.title||('עמוד '+(i+1)))+'</span>'+
      '<span class="tag">'+tag+'</span>'+
      '<button class="btn sm" data-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button>'+
      '<button class="btn sm" data-down="'+i+'" '+(i===model.pages.length-1?'disabled':'')+'>↓</button></div>';
  }).join('');
  list.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>movePage(+b.dataset.up,-1)));
  list.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click',()=>movePage(+b.dataset.down,+1)));
}

/* הזזת עמוד מבוססת-טקסט (הטקסט הוא מקור האמת) */
function splitPages(text){
  const raw = text.replace(/\r\n?/g,'\n');
  const lines = raw.split('\n');
  const isStart = s => /^#\s+/.test(s) && !/^##/.test(s);
  let firstPage = lines.findIndex(isStart);
  if (firstPage < 0) return { preamble:raw, chunks:[] };
  const preamble = lines.slice(0, firstPage).join('\n');
  const chunks = [];
  let i = firstPage;
  while (i < lines.length){
    if (isStart(lines[i])){
      let j = i+1; while (j < lines.length && !isStart(lines[j])) j++;
      chunks.push(lines.slice(i,j).join('\n'));
      i = j;
    } else i++;
  }
  return { preamble, chunks };
}
function movePage(idx, dir){
  const { preamble, chunks } = splitPages(srcEl.value);
  const j = idx + dir;
  if (j < 0 || j >= chunks.length) return;
  const tmp = chunks[idx]; chunks[idx] = chunks[j]; chunks[j] = tmp;
  const joined = (preamble.trim() ? preamble.replace(/\n+$/,'') + '\n\n' : '') +
    chunks.map(c=>c.replace(/\n+$/,'')).join('\n\n') + '\n';
  srcEl.value = joined;
  renderAll();
  toast('סדר העמודים עודכן');
}

function renderAssetStatus(model){
  const summary = $('#assetsSummary');
  const listEl = $('#assetList');
  const chosen = Object.keys(state.assets).length;
  if (!state.assetsChosen){ summary.textContent = 'לא נבחרה תיקיית מדיה.'; }
  else { summary.textContent = chosen + ' קבצים נטענו מהתיקייה.'; }

  const refs = [...new Set((model.mediaRefs||[]).map(baseName))];
  if (!refs.length && !chosen){ listEl.innerHTML = ''; return; }
  let html = '';
  refs.forEach(r=>{
    const have = !!state.assets[r];
    html += '<div>'+(have?'<span class="ok">✓</span> ':'<span class="miss">✗ חסר</span> ')+escHtml(r)+'</div>';
  });
  // קבצים שנטענו אך אינם בשימוש
  const used = new Set(refs);
  Object.keys(state.assets).forEach(k=>{ if (!used.has(k)) html += '<div class="hint">• '+escHtml(k)+' (לא בשימוש)</div>'; });
  listEl.innerHTML = html;
}

/* ---------- טעינת קבצים ---------- */
$('#fileText').addEventListener('change', e=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{ srcEl.value = r.result; renderAll(); toast('הטקסט נטען'); };
  r.readAsText(f, 'utf-8');
});

$('#fileAssets').addEventListener('change', e=>{
  // שחרור URLs ישנים
  for (const k in state.assets){ try{ URL.revokeObjectURL(state.assets[k].url); }catch(_){} }
  state.assets = {};
  const files = [...e.target.files];
  files.forEach(f=>{
    const bn = baseName(f.webkitRelativePath || f.name);
    const ext = (bn.split('.').pop()||'').toLowerCase();
    if (IMAGE_EXT.includes(ext) || VIDEO_EXT.includes(ext)){
      state.assets[bn] = { file:f, url: URL.createObjectURL(f) };
    }
  });
  state.assetsChosen = true;
  renderAll();
  toast(Object.keys(state.assets).length + ' קבצי מדיה נטענו');
});

/* ---------- עריכת פרטי ספר בטופס -> טקסט ---------- */
$('#fTitle').addEventListener('input', e=>{ setMeta('TITLE', e.target.value); });
$('#fPass').addEventListener('input', e=>{ setMeta('PASS', e.target.value); });
function setMeta(key, val){
  const lines = srcEl.value.replace(/\r\n?/g,'\n').split('\n');
  const re = new RegExp('^'+key+':','i');
  let idx = -1;
  const firstPage = lines.findIndex(s=>/^#\s+/.test(s) && !/^##/.test(s));
  const limit = firstPage<0 ? lines.length : firstPage;
  for (let i=0;i<limit;i++){ if (re.test(lines[i].trim())){ idx=i; break; } }
  const newLine = key + ': ' + val;
  if (idx>=0) lines[idx] = newLine;
  else lines.unshift(newLine);
  srcEl.value = lines.join('\n');
  scheduleRender();
}

/* ---------- עריכה בטקסטאריה ---------- */
srcEl.addEventListener('input', scheduleRender);

/* ---------- הורדת טקסט ---------- */
$('#btnDownload').addEventListener('click', ()=>{
  const name = (state.model && state.model.title ? state.model.title : 'textbook').replace(/[\\/:*?"<>|]/g,'_');
  downloadBlob(new Blob([srcEl.value], {type:'text/plain;charset=utf-8'}), name + '.txt');
  toast('הטקסט הורד');
});

/* ============================================================
   ZIP (STORE, ללא דחיסה) + CRC32 — עצמאי, ללא תלות חיצונית
   ============================================================ */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1); } t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++){ c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c>>>8); } return (c ^ 0xFFFFFFFF)>>>0; }
function strToU8(str){ return new TextEncoder().encode(str); }

function makeZip(files){
  // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21; // 1980-01-01

  files.forEach(f=>{
    const nameU8 = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    // local header
    const lh = new Uint8Array(30 + nameU8.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);       // version
    dv.setUint16(6, 0x0800, true);   // flags: UTF-8 filenames
    dv.setUint16(8, 0, true);        // method: store
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameU8.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameU8, 30);
    chunks.push(lh, data);

    // central dir entry
    const ch = new Uint8Array(46 + nameU8.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameU8.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameU8, 46);
    central.push(ch);

    offset += lh.length + data.length;
  });

  const centralSize = central.reduce((s,c)=>s+c.length,0);
  const centralOffset = offset;
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);

  const all = [...chunks, ...central, eocd];
  const total = all.reduce((s,c)=>s+c.length,0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(c=>{ out.set(c, p); p += c.length; });
  return out;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- איסוף קבצי מדיה בשימוש ---------- */
async function gatherAssetFiles(model){
  const refs = [...new Set((model.mediaRefs||[]).map(baseName))];
  const out = [];
  const missing = [];
  for (const r of refs){
    const a = state.assets[r];
    if (!a){ missing.push(r); continue; }
    const buf = new Uint8Array(await a.file.arrayBuffer());
    out.push({ name:'assets/'+r, data:buf });
  }
  return { out, missing };
}

function safeName(model, suffix){
  return (model.title || 'textbook').replace(/[\\/:*?"<>|]/g,'_').slice(0,60) + suffix;
}

/* ---------- ייצוא אתר עצמאי ---------- */
$('#btnSite').addEventListener('click', async ()=>{
  const model = parseBook(srcEl.value);
  if (!model.pages.length){ toast('אין תוכן לייצוא'); return; }
  const btn = $('#btnSite'); btn.disabled = true; btn.textContent = '⏳ מייצא...';
  try {
    const { out, missing } = await gatherAssetFiles(model);
    const html = buildReaderDoc(model, { mode:'standalone', assets:{} });
    const files = [{ name:'index.html', data: strToU8(html) }, ...out];
    const zip = makeZip(files);
    downloadBlob(new Blob([zip], {type:'application/zip'}), safeName(model,'_site.zip'));
    toast(missing.length ? 'יוצא (⚠️ '+missing.length+' קבצי מדיה חסרים)' : 'האתר יוצא בהצלחה');
  } catch(err){ console.error(err); toast('שגיאה בייצוא'); }
  finally { btn.disabled = false; btn.textContent = '🌐 ייצוא אתר עצמאי'; }
});

/* ---------- ייצוא SCORM 1.2 ---------- */
function buildManifest(model, assetNames){
  const title = escHtml(model.title || 'ספר לימוד דיגיטלי');
  const fileEntries = ['<file href="index.html"/>']
    .concat(assetNames.map(n=>'<file href="'+escHtml(n)+'"/>')).join('\n      ');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
'<manifest identifier="TBG_MANIFEST_'+Date.now()+'" version="1.0"\n' +
'  xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"\n' +
'  xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"\n' +
'  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n' +
'  xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd http://www.imsglobal.org/xsd/imsmd_rootv1p2p1 imsmd_rootv1p2p1.xsd http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">\n' +
'  <metadata>\n    <schema>ADL SCORM</schema>\n    <schemaversion>1.2</schemaversion>\n  </metadata>\n' +
'  <organizations default="ORG">\n    <organization identifier="ORG">\n      <title>'+title+'</title>\n' +
'      <item identifier="ITEM1" identifierref="RES1" isvisible="true">\n        <title>'+title+'</title>\n' +
'        <adlcp:masteryscore>'+(typeof model.pass==='number'?model.pass:70)+'</adlcp:masteryscore>\n      </item>\n' +
'    </organization>\n  </organizations>\n' +
'  <resources>\n    <resource identifier="RES1" type="webcontent" adlcp:scormtype="sco" href="index.html">\n      ' +
      fileEntries + '\n    </resource>\n  </resources>\n</manifest>\n';
}

$('#btnScorm').addEventListener('click', async ()=>{
  const model = parseBook(srcEl.value);
  if (!model.pages.length){ toast('אין תוכן לייצוא'); return; }
  const btn = $('#btnScorm'); btn.disabled = true; btn.textContent = '⏳ מייצא...';
  try {
    const { out, missing } = await gatherAssetFiles(model);
    const html = buildReaderDoc(model, { mode:'scorm', assets:{} });
    const assetNames = out.map(f=>f.name);
    const manifest = buildManifest(model, assetNames);
    const files = [
      { name:'index.html', data: strToU8(html) },
      { name:'imsmanifest.xml', data: strToU8(manifest) },
      ...out
    ];
    const zip = makeZip(files);
    downloadBlob(new Blob([zip], {type:'application/zip'}), safeName(model,'_scorm.zip'));
    toast(missing.length ? 'SCORM יוצא (⚠️ '+missing.length+' קבצים חסרים)' : 'חבילת SCORM יוצאה');
  } catch(err){ console.error(err); toast('שגיאה בייצוא'); }
  finally { btn.disabled = false; btn.textContent = '🎓 ייצוא SCORM'; }
});
