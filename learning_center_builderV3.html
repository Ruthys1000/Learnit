<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מחולל מרכז למידה | Bento</title>
<style id="appCss">
  :root{
    --bg:#eef2f9;--panel:#ffffff;--ink:#141b2b;--muted:#5c6b83;--line:#dde5f1;
    --brand:#4f46e5;--brand-soft:#eef0ff;--brand-ink:#4338ca;--danger:#dc2626;
    --shadow:0 20px 50px rgba(20,27,43,.14);--radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant','Heebo',Arial,sans-serif;line-height:1.55}
  button,input,textarea,select{font-family:inherit}
  .app{min-height:100vh;display:grid;grid-template-columns:440px 1fr}
  .editor{background:var(--panel);border-inline-end:1px solid var(--line);height:100vh;position:sticky;top:0;overflow:auto;padding:16px;box-shadow:12px 0 32px rgba(20,27,43,.05);z-index:5}
  .editorTop{display:grid;gap:11px;margin-bottom:14px}
  .toolTitle{display:flex;align-items:center;gap:10px;margin:0;font-size:20px;letter-spacing:-.03em}
  .toolTitle .m{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--brand),#a855f7);box-shadow:0 12px 26px rgba(79,70,229,.28);font-size:20px}
  .hint{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actions.three{grid-template-columns:1fr 1fr 1fr}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:38px;line-height:1.2;transition:transform .12s,border-color .2s}
  .btn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 12px 24px rgba(79,70,229,.24)}
  .btn.dark{background:#0f172a;color:#fff;border-color:#0f172a}
  .btn.danger{color:#b91c1c;border-color:rgba(220,38,38,.28);background:#fff}
  .btn.sm{padding:6px 9px;font-size:12px;min-height:30px}
  .btn.icon{padding:6px;width:32px;height:32px;min-height:32px;justify-content:center}
  label.filebtn{position:relative;overflow:hidden;cursor:pointer}
  label.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

  .sec{border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:11px;overflow:hidden}
  .sec>summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:"+";width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);font-weight:900;flex:0 0 auto}
  .sec[open]>summary::after{content:"–"}
  .sec>summary .cnt{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-weight:800;margin-inline-start:auto}
  .body{padding:0 14px 15px;display:grid;gap:11px}
  .field{display:grid;gap:5px}
  .field label{font-size:12px;color:var(--muted);font-weight:800}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 11px;color:var(--ink);background:var(--bg);outline:none;font-size:14px}
  .field textarea{min-height:80px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .colorField{display:flex;align-items:center;gap:8px}
  .colorField input[type=color]{width:40px;height:34px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
  .fileNote{font-size:11px;color:var(--muted)}

  .palette{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{width:54px;height:42px;border-radius:12px;border:2px solid transparent;cursor:pointer;padding:0;display:flex;overflow:hidden;box-shadow:0 4px 12px rgba(20,27,43,.16);transition:transform .15s}
  .pchip:hover{transform:translateY(-2px)}
  .pchip.active{border-color:var(--ink);box-shadow:0 0 0 3px var(--brand-soft)}
  .pchip i{flex:1;display:block}

  .zone{border:1px solid var(--line);background:var(--bg);border-radius:15px;overflow:hidden;transition:border-color .15s,box-shadow .15s;scroll-margin-top:12px}
  .zone.editing{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .zoneHead{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  .zone.editing .zoneHead{background:var(--brand-soft)}
  .editingTag{display:none;font-size:10.5px;font-weight:900;color:#fff;background:var(--brand);border-radius:999px;padding:3px 8px;flex:0 0 auto}
  .zone.editing .editingTag{display:inline-block}
  .zoneHandle{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand-ink);flex:0 0 auto}
  .zoneName{flex:1;font-weight:900;font-size:13px;border:0;background:transparent;color:var(--ink);outline:none;min-width:0}
  .zoneOps{display:flex;gap:3px;flex:0 0 auto}
  .zoneBody{padding:11px;display:grid;gap:10px}
  .miniLabel{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:-3px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:6px 9px;font-size:11.5px;font-weight:800;cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .iconGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:150px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .iconGrid button{aspect-ratio:1;border:1px solid transparent;border-radius:9px;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
  .iconGrid button:hover{border-color:var(--brand)}
  .iconGrid button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .iconGrid svg{width:20px;height:20px}

  .pairItem{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:10px;display:grid;gap:8px}
  .pairTop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:12px;color:var(--muted)}

  .previewArea{overflow:auto;height:100vh;background:var(--bg)}
  .pvbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .pvbar .lbl{font-weight:900;font-size:13px;color:var(--muted)}
  .pvScale{display:flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:800}
  #previewHost{padding:26px}

  .toast{position:fixed;inset-inline-start:22px;bottom:22px;z-index:60;max-width:340px;background:#0f172a;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 18px 40px rgba(0,0,0,.3);opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;font-size:14px}
  .toast.show{opacity:1;transform:translateY(0)}
  .floatingEdit{position:fixed;inset-inline-start:18px;top:18px;z-index:40;display:none}
  body.viewOnly .app{grid-template-columns:1fr}
  body.viewOnly .editor{display:none}
  body.viewOnly .previewArea{height:auto;min-height:100vh}
  body.viewOnly .pvbar{display:none}
  body.viewOnly .floatingEdit{display:inline-flex}

  @media(max-width:1080px){.app{grid-template-columns:1fr}.editor{position:relative;height:auto;border-inline-end:0;border-bottom:1px solid var(--line)}.previewArea{height:auto}}
</style>

<style id="pageCssHost"></style>
</head>
<body>
  <div class="app">
    <button class="btn floatingEdit" onclick="setMode('edit')">‹ חזרה לעריכה</button>

    <aside class="editor">
      <div class="editorTop">
        <h1 class="toolTitle"><span class="m">◆</span> מחולל מרכז למידה</h1>
        <p class="hint">בנו דף מרכז למידה בסגנון Bento: באנר פתיחה + אזורים בגדלים שונים, כל אזור מקשר לדף, קובץ, מילון מונחים, שו"ת או תוכן פנימי. הכל מיוצא כ־HTML עצמאי אחד עם תמונות מוטמעות — מתאים לרשת מנותקת.</p>
        <div class="actions">
          <button class="btn primary" onclick="exportHtml()">⬇ ייצוא HTML</button>
          <button class="btn dark" onclick="copyHtml()">העתקת HTML</button>
        </div>
        <div class="actions three">
          <button class="btn" onclick="setMode('view')">תצוגה מלאה</button>
          <button class="btn" onclick="downloadJson()">שמירת נתונים</button>
          <label class="btn filebtn">טעינת נתונים<input type="file" accept="application/json" onchange="loadJson(event)"></label>
        </div>
        <div class="actions">
          <button class="btn" onclick="saveToBrowser()">שמירה בדפדפן</button>
          <button class="btn danger" onclick="resetData()">איפוס לדוגמה</button>
        </div>
      </div>
      <div id="editorFields"></div>
    </aside>

    <section class="previewArea">
      <div class="pvbar">
        <span class="lbl">תצוגה חיה</span>
        <div class="pvScale">
          <span>רוחב</span>
          <select id="pvWidth" onchange="applyPreviewWidth()">
            <option value="1280">1280px</option>
            <option value="1440">1440px</option>
            <option value="1600">1600px</option>
            <option value="1920">1920px (Full HD)</option>
            <option value="100%">מלא</option>
          </select>
        </div>
      </div>
      <div id="previewHost"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

/* ============================== STATE / HELPERS ============================== */
const clone=o=>JSON.parse(JSON.stringify(o));
function mergeDeep(t,s){if(!s||typeof s!=="object")return t;Object.keys(s).forEach(k=>{if(Array.isArray(s[k]))t[k]=s[k];else if(s[k]&&typeof s[k]==="object")t[k]=mergeDeep(t[k]||{},s[k]);else t[k]=s[k]});return t}
function loadInitial(){try{const s=localStorage.getItem(STORAGE_KEY);if(s){const d=mergeDeep(clone(defaultData),JSON.parse(s));(d.zones||[]).forEach(z=>{if(!z.id)z.id=zid()});return d}}catch(e){}return clone(defaultData)}
let data=loadInitial();

function esc(v=""){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function escBr(v=""){return esc(v).replace(/\n/g,"<br>")}
function attr(v=""){return esc(v).replace(/'/g,"&#39;")}
function autosave(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200)}
function set(path,val){const p=path.split(".");let o=data;while(p.length>1){o=o[p.shift()]}o[p[0]]=val;autosave();renderPreview()}
function zoneById(id){return data.zones.find(z=>z.id===id)}
function setZone(id,key,val){const z=zoneById(id);if(!z)return;z[key]=val;autosave();renderPreview()}
function setTarget(id,key,val){const z=zoneById(id);if(!z)return;z.target[key]=val;autosave();renderPreview()}
function addLink(id){const z=zoneById(id);if(!z)return;(z.links=z.links||[]).push({text:"",url:""});autosave();renderEditor();renderPreview()}
function removeLink(id,i){const z=zoneById(id);if(!z||!z.links)return;z.links.splice(i,1);autosave();renderEditor();renderPreview()}
function setLink(id,i,key,val){const z=zoneById(id);if(!z||!z.links||!z.links[i])return;z.links[i][key]=val;autosave();renderPreview()}

function hexToRgb(hex){let h=String(hex||"").replace("#","").trim();if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h||"111633",16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function isLight(hex){const{r,g,b}=hexToRgb(hex);return(0.2126*r+0.7152*g+0.0722*b)/255>0.6}
function rgba(hex,a){const{r,g,b}=hexToRgb(hex);return`rgba(${r},${g},${b},${a})`}
function mix(hex,hex2,t){const a=hexToRgb(hex),b=hexToRgb(hex2);const r=Math.round(a.r+(b.r-a.r)*t),g=Math.round(a.g+(b.g-a.g)*t),bl=Math.round(a.b+(b.b-a.b)*t);return`rgb(${r},${g},${bl})`}

.lcSectionHead h2{margin:0;font-size:26px;letter-spacing:-.03em;color:var(--ink)}
.lcSectionHead span{color:var(--muted);font-size:14px;font-weight:700}

.lcBento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:184px;gap:16px;grid-auto-flow:dense}
.lcTile{position:relative;overflow:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;text-align:start;cursor:pointer;text-decoration:none;border:1px solid var(--line);transition:transform .18s,box-shadow .2s;min-width:0}
.lcTile:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.16)}
.lcTile.sm{grid-column:span 1;grid-row:span 1}
.lcTile.wide{grid-column:span 2;grid-row:span 1}
.lcTile.tall{grid-column:span 1;grid-row:span 2}
.lcTile.lg{grid-column:span 2;grid-row:span 2}

.lcIcon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;margin-bottom:13px}
.lcIcon svg{width:26px;height:26px}
.lcTileTitle{margin:0 0 7px;font-size:19px;letter-spacing:-.02em;line-height:1.2}
.lcTileDesc{margin:0;font-size:14px;line-height:1.5;overflow:hidden}
/* CTA pinned to the bottom of every tile so it can never be pushed out / clipped */
.lcTileFoot{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:14px;margin-top:auto;padding-top:12px}
.lcTileFoot svg{width:18px;height:18px}
.lcTileFoot .arr{transition:transform .18s;flex:0 0 auto}
.lcTile:hover .lcTileFoot .arr{transform:translateX(-5px)}
.lcTag{position:absolute;inset-inline-end:16px;top:16px;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px;letter-spacing:.02em}

/* links block: same card look, a bulleted list of links instead of a single CTA */
.lcLinksTile{cursor:default}
.lcLinkList{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
.lcLinkList li{position:relative;padding-inline-start:16px}
.lcLinkList li:before{content:"";position:absolute;inset-inline-start:2px;top:9px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.lcLinkList a{color:inherit;text-decoration:none;font-size:14px;font-weight:700;line-height:1.4}
.lcLinkList a:hover{text-decoration:underline}
.lcTile.tstyle-soft .lcLinkList a{color:var(--t)}

/* single-row tiles (sm + wide): compact rhythm + 2-line clamp so content fits one row */
.lcTile.sm,.lcTile.wide{padding:18px}
.lcTile.sm .lcIcon,.lcTile.wide .lcIcon{width:44px;height:44px;margin-bottom:9px}
.lcTile.sm .lcIcon svg,.lcTile.wide .lcIcon svg{width:22px;height:22px}
.lcTile.sm .lcTileDesc,.lcTile.wide .lcTileDesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lcTile.sm .lcTileTitle{font-size:17px}
.lcTile.wide .lcTileTitle{font-size:20px}
.lcTile.sm .lcTileFoot,.lcTile.wide .lcTileFoot{font-size:13px;padding-top:8px}
/* multi-row tiles have vertical room for a bigger title + more lines */
.lcTile.lg .lcTileTitle{font-size:25px}
.lcTile.lg .lcTileFoot svg{width:20px;height:20px}
.lcTile.tall .lcTileDesc,.lcTile.lg .lcTileDesc{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
/* editor-only: highlight the tile currently being edited (never applied in export) */
.lcTile.lc-editing{outline:3px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 6px rgba(0,0,0,.04)}

/* bold tiles: gradient bg, white text */
.lcTile.tstyle-bold{color:#fff;border-color:transparent;background:linear-gradient(150deg,var(--t),var(--t2))}
.lcTile.tstyle-bold .lcIcon{background:rgba(255,255,255,.18);color:#fff}
.lcTile.tstyle-bold .lcTileDesc{color:rgba(255,255,255,.9)}
.lcTile.tstyle-bold .lcTileFoot{color:#fff}
.lcTile.tstyle-bold .lcTag{background:rgba(255,255,255,.22);color:#fff}
.lcTile.tstyle-bold .lcDeco{position:absolute;inset-inline-start:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10)}

/* soft tiles: tinted card (tint layered over panel, so absolute children keep working) */
.lcTile.tstyle-soft{background:linear-gradient(var(--tsoft),var(--tsoft)),var(--panel);color:var(--ink)}
.lcTile.tstyle-soft .lcIcon{background:var(--tchip);color:var(--t)}
.lcTile.tstyle-soft .lcTileDesc{color:var(--muted)}
.lcTile.tstyle-soft .lcTileFoot{color:var(--t)}
.lcTile.tstyle-soft .lcTag{background:var(--tchip);color:var(--t)}

.lcFooter{margin-top:46px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:22px}

/* modal */
.lcModal{position:fixed;inset:0;background:rgba(9,13,24,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:9999;backdrop-filter:blur(3px)}
.lcModal.open{display:flex}
.lcModalBox{background:var(--panel);color:var(--ink);border-radius:24px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:32px 34px 30px;box-shadow:0 34px 90px rgba(0,0,0,.45);position:relative;border:1px solid var(--line)}
.lcModalClose{position:absolute;inset-inline-start:16px;top:16px;border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.lcModalClose:hover{color:var(--ink)}
.lcModalHead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lcModalHead .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.lcModalHead .ic svg{width:24px;height:24px}
.lcModalHead h3{margin:0;font-size:22px;letter-spacing:-.03em}
.lcModalBody{font-size:15.5px;line-height:1.75}
.lcModalBody img{max-width:100%;border-radius:12px}
.lcGloss{display:grid;gap:12px}
.lcGlossItem{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg)}
.lcGlossItem b{display:block;color:var(--primary);font-size:16px;margin-bottom:4px}
.lcGlossItem span{color:var(--muted)}
.lcGlossSearch{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;background:var(--bg);color:var(--ink);font-size:15px;outline:none;font-family:inherit}
.lcGlossSearch:focus{border-color:var(--primary)}
.lcFaqItem{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--bg)}
.lcFaqItem summary{cursor:pointer;list-style:none;padding:15px 16px;font-weight:900;display:flex;justify-content:space-between;gap:12px;align-items:center}
.lcFaqItem summary::-webkit-details-marker{display:none}
.lcFaqItem summary:after{content:"+";width:26px;height:26px;min-width:26px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--primary);font-weight:900}
.lcFaqItem[open] summary:after{content:"–"}
.lcFaqAns{padding:0 16px 16px;color:var(--muted);line-height:1.7}

@media(max-width:1024px){.lcBento{grid-template-columns:repeat(2,1fr)}.lcTile.lg,.lcTile.wide{grid-column:span 2}.lcTile.tall{grid-row:span 2}}
@media(max-width:620px){.lcBento{grid-template-columns:1fr;grid-auto-rows:auto}.lcTile{grid-column:span 1 !important;grid-row:auto !important;min-height:150px}.lcHeroInner{padding:36px 26px}}
`;

/* hero overlay vars depend on hero-base darkness */
function heroOverlayVars(){
  const base=data.settings.heroBase;
  return {"--hero-ov1":rgba(base,.94),"--hero-ov2":rgba(base,.72),"--hero-ov3":rgba(base,.30)};
}

/* ============================== RENDER: PAGE MARKUP (shared) ============================== */
function targetAttrs(z){
  const t=z.target||{};
  if(t.type==="link") return ` href="${attr(t.url||'#')}" target="_blank" rel="noopener"`;
  if(t.type==="file"){
    if(t.fileData) return ` href="${attr(t.fileData)}" download="${attr(t.fileName||'file')}"`;
    return ` href="#" onclick="return false"`;
  }
  // modal / glossary / faq
  return ` href="javascript:void 0" onclick="lcOpen('${z.id}');return false"`;
}
function tileVars(z){
  const a=z.accent||data.settings.primary;
  const t2=mix(a, data.settings.accent, .5);
  const soft = data.settings.mode==="dark" ? rgba(a,.16) : rgba(a,.08);
  const chip = data.settings.mode==="dark" ? rgba(a,.22) : rgba(a,.14);
  return `--t:${a};--t2:${t2};--tsoft:${soft};--tchip:${chip}`;
}
function tileTag(z){
  const t=z.target||{};
  const map={link:"קישור",file:"קובץ",modal:"מידע",glossary:"מילון",faq:"שו\"ת"};
  return map[t.type]||"";
}
function renderTiles(){
  return data.zones.map(z=>{
    const arrow='<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>';
    const deco = z.style==="bold" ? '<span class="lcDeco"></span>' : '';
    if(z.kind==="links"){
      const items=(z.links||[]).filter(l=>l.text||l.url).map(l=>
        `<li><a href="${attr(l.url||'#')}" target="_blank" rel="noopener">${esc(l.text||l.url)}</a></li>`
      ).join("");
      return `<div class="lcTile lcLinksTile ${esc(z.size)} tstyle-${esc(z.style)}" data-zid="${esc(z.id)}" style="${tileVars(z)}">
      ${deco}
      <span class="lcTag">קישורים</span>
      <span class="lcIcon">${iconSvg(z.icon)}</span>
      <h3 class="lcTileTitle">${esc(z.title)}</h3>
      <ul class="lcLinkList">${items}</ul>
    </div>`;
    }
    return `<a class="lcTile ${esc(z.size)} tstyle-${esc(z.style)}" data-zid="${esc(z.id)}" style="${tileVars(z)}"${targetAttrs(z)}>
      ${deco}
      ${tileTag(z)?`<span class="lcTag">${esc(tileTag(z))}</span>`:''}
      <span class="lcIcon">${iconSvg(z.icon)}</span>
      <h3 class="lcTileTitle">${esc(z.title)}</h3>
      <p class="lcTileDesc">${escBr(z.desc)}</p>
      ${z.cta?`<span class="lcTileFoot">${esc(z.cta)} ${arrow}</span>`:''}
    </a>`;
  }).join("");
}
function heroCta(text,type,url,cls){
  if(!text)return"";
  let a;
  if(type==="link") a=` href="${attr(url||'#')}" target="_blank" rel="noopener"`;
  else if(type==="scroll") a=` href="javascript:void 0" onclick="lcScrollZones();return false"`;
  else if(type==="glossary"||type==="faq") a=` href="javascript:void 0" onclick="lcOpenSpecial('${type}');return false"`;
  else a=` href="${attr(url||'#')}"`;
  return `<a class="lcBtn ${cls}"${a}>${esc(text)}</a>`;
}
function renderPageHTML(){
  const b=data.brand,h=data.hero;
  const logo = b.logo ? `<img src="${attr(b.logo)}" alt="">` : esc(b.logoText||"◆");
  const heroStyle = h.banner ? ` style="background-image:url('${attr(h.banner)}')"` : "";
  const today = new Date().toLocaleDateString("he-IL",{year:"numeric",month:"long"});
  return `<div class="lcPage">
    <div class="lcTopbar">
      <div class="lcBrand"><span class="lcMark">${logo}</span><span class="lcBrandName">${esc(b.org)}</span></div>
      <span class="lcDate">${esc(today)}</span>
    </div>

    <header class="lcHero"${heroStyle}>
      <span class="lcHeroBlob a"></span><span class="lcHeroBlob b"></span>
      <div class="lcHeroInner">
        ${h.eyebrow?`<span class="lcEyebrow">${esc(h.eyebrow)}</span>`:''}
        <h1>${esc(h.title)}</h1>
        ${h.subtitle?`<p>${esc(h.subtitle)}</p>`:''}
        <div class="lcHeroActions">
          ${heroCta(h.ctaText,h.ctaType,h.ctaUrl,"lcBtnPrimary")}
          ${heroCta(h.cta2Text,h.cta2Type,h.cta2Url,"lcBtnGhost")}
        </div>
      </div>
    </header>

    <div class="lcSectionHead" id="lcZones">
      <h2>אזורי הלמידה</h2>
      <span>בחרו אזור כדי להתחיל</span>
    </div>
    <div class="lcBento">${renderTiles()}</div>

    <footer class="lcFooter">${esc(data.footer||"")}</footer>
  </div>

  <div class="lcModal" id="lcModal" onclick="if(event.target===this)lcClose()">
    <div class="lcModalBox">
      <button class="lcModalClose" onclick="lcClose()" aria-label="סגירה">×</button>
      <div class="lcModalHead"><span class="ic" id="lcModalIcon"></span><h3 id="lcModalTitle"></h3></div>
      <div class="lcModalBody" id="lcModalBody"></div>
    </div>
  </div>`;
}

/* ============================== RUNTIME (shared: preview + export) ============================== */
/* Stored as plain string so it can be embedded in the exported file without template-literal clashes. */
const RUNTIME_DATA = ()=>({zones:data.zones.map(z=>({id:z.id,icon:z.icon,title:z.title,target:z.target})),glossary:data.glossary,faq:data.faq,icons:ICONS});
const RUNTIME_JS = `
(function(){
  var D=window.__LC__;
  function iconSvg(k){var p=(D.icons&&D.icons[k])||'';return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function glossaryHTML(){
    var items=D.glossary||[];
    var rows=items.map(function(g){return '<div class="lcGlossItem" data-t="'+esc((g.term+' '+g.def).toLowerCase())+'"><b>'+esc(g.term)+'</b><span>'+esc(g.def)+'</span></div>';}).join('');
    return '<input class="lcGlossSearch" placeholder="חיפוש מונח..." oninput="lcGlossFilter(this)"><div class="lcGloss">'+rows+'</div>';
  }
  function faqHTML(){
    var items=D.faq||[];
    return items.map(function(f){return '<details class="lcFaqItem"><summary>'+esc(f.q)+'</summary><div class="lcFaqAns">'+esc(f.a)+'</div></details>';}).join('');
  }
  window.lcGlossFilter=function(inp){
    var q=inp.value.toLowerCase();
    inp.parentNode.querySelectorAll('.lcGlossItem').forEach(function(el){el.style.display=el.getAttribute('data-t').indexOf(q)>-1?'':'none';});
  };
  function openModal(icon,title,html){
    var m=document.getElementById('lcModal');
    document.getElementById('lcModalIcon').innerHTML=iconSvg(icon);
    document.getElementById('lcModalTitle').textContent=title;
    document.getElementById('lcModalBody').innerHTML=html;
    m.classList.add('open');document.body.style.overflow='hidden';
  }
  window.lcOpen=function(id){
    var z=(D.zones||[]).filter(function(x){return x.id===id;})[0];if(!z)return;
    var t=z.target||{};
    if(t.type==='glossary')return openModal('glossary','מילון מונחים',glossaryHTML());
    if(t.type==='faq')return openModal('faq','שאלות ותשובות',faqHTML());
    openModal(z.icon,z.title,t.html||'<p style="color:var(--muted)">אין תוכן להצגה עדיין.</p>');
  };
  window.lcOpenSpecial=function(type){
    if(type==='glossary')return openModal('glossary','מילון מונחים',glossaryHTML());
    if(type==='faq')return openModal('faq','שאלות ותשובות',faqHTML());
  };
  window.lcClose=function(){document.getElementById('lcModal').classList.remove('open');document.body.style.overflow='';};
  window.lcScrollZones=function(){var e=document.getElementById('lcZones');if(e)e.scrollIntoView({behavior:'smooth'});};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')lcClose();});
})();
`;

/* ============================== PREVIEW ============================== */
function renderPreview(){
  document.getElementById("pageCssHost").textContent = FONT_CSS + PAGE_CSS;
  const host=document.getElementById("previewHost");
  const vars={...themeVars(),...heroOverlayVars()};
  let styleStr=Object.entries(vars).map(([k,v])=>`${k}:${v}`).join(";");
  const pw=document.getElementById("pvWidth").value;
  styleStr+=";--pw:"+(pw==="100%"?"100%":pw+"px");
  host.innerHTML=`<div class="lcRoot" style="${styleStr}">${renderPageHTML()}</div>`;
  // (re)install runtime
  window.__LC__=RUNTIME_DATA();
  try{ (new Function(RUNTIME_JS))(); }catch(e){ eval(RUNTIME_JS); }
  reapplyEditing();
}
function applyPreviewWidth(){renderPreview()}

/* ============================== EDITOR ============================== */
function sizeSeg(z){
  const opts=[["lg","ענק"],["wide","רחב"],["tall","גבוה"],["sm","קטן"]];
  return opts.map(([v,l])=>`<button class="${z.size===v?'on':''}" onclick="setZone('${z.id}','size','${v}')">${l}</button>`).join("");
}
function styleSeg(z){
  const opts=[["bold","בולט"],["soft","עדין"]];
  return opts.map(([v,l])=>`<button class="${z.style===v?'on':''}" onclick="setZone('${z.id}','style','${v}')">${l}</button>`).join("");
}
function targetSeg(z){
  const opts=[["link","קישור"],["file","קובץ"],["modal","תוכן פנימי"],["glossary","מילון"],["faq","שו\"ת"]];
  return opts.map(([v,l])=>`<button class="${z.target.type===v?'on':''}" onclick="setTarget('${z.id}','type','${v}');renderEditor()">${l}</button>`).join("");
}
function targetFields(z){
  const t=z.target;
  if(t.type==="link") return `<div class="field"><label>כתובת קישור (URL)</label><input value="${attr(t.url)}" placeholder="https://..." oninput="setTarget('${z.id}','url',this.value)"></div>`;
  if(t.type==="file") return `<div class="field"><label>קובץ להורדה (מוטמע בקובץ הסופי)</label>
      <label class="btn filebtn sm" style="justify-self:start">${t.fileData?'החלפת קובץ':'העלאת קובץ'}<input type="file" onchange="uploadZoneFile('${z.id}',event)"></label>
      ${t.fileData?`<div class="fileNote">✓ ${esc(t.fileName)} <button class="btn sm danger" onclick="clearZoneFile('${z.id}')">הסרה</button></div>`:'<div class="fileNote">PDF, Word, תמונה או כל קובץ אחר</div>'}</div>`;
  if(t.type==="modal") return `<div class="field"><label>תוכן פנימי (נפתח בחלון מודאלי · תומך HTML בסיסי)</label><textarea oninput="setTarget('${z.id}','html',this.value)" placeholder="<p>טקסט...</p>">${esc(t.html)}</textarea></div>`;
  if(t.type==="glossary") return `<div class="fileNote">האזור יפתח את <b>מילון המונחים</b> שמוגדר במקטע נפרד למטה.</div>`;
  if(t.type==="faq") return `<div class="fileNote">האזור יפתח את <b>שאלות ותשובות</b> שמוגדרות במקטע נפרד למטה.</div>`;
  return "";
}
function iconPicker(z){
  return `<div class="iconGrid">`+ICON_KEYS.map(k=>`<button class="${z.icon===k?'on':''}" title="${k}" onclick="setZone('${z.id}','icon','${k}');renderEditor()">${iconSvg(k)}</button>`).join("")+`</div>`;
}
function accentPicker(z){
  const chips=TILE_SWATCHES.map(c=>`<button class="btn icon" style="background:${c};border-color:${z.accent===c?'var(--ink)':'transparent'}" onclick="setZone('${z.id}','accent','${c}')"></button>`).join("");
  return `<div class="row">${chips}<input type="color" value="${attr(z.accent)}" oninput="setZone('${z.id}','accent',this.value)" style="width:34px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;cursor:pointer"></div>`;
}
function linksFields(z){
  const rows=(z.links||[]).map((l,li)=>`
      <div class="row" style="align-items:end;gap:8px;margin-bottom:8px">
        <div class="field" style="flex:1"><label>טקסט</label><input value="${attr(l.text)}" oninput="setLink('${z.id}',${li},'text',this.value)"></div>
        <div class="field" style="flex:1.4"><label>קישור (URL)</label><input value="${attr(l.url)}" placeholder="https://..." oninput="setLink('${z.id}',${li},'url',this.value)"></div>
        <button class="btn icon sm danger" onclick="removeLink('${z.id}',${li})">✕</button>
      </div>`).join("");
  return `<div class="field"><label>שורות הקישורים</label>${rows}
      <button class="btn sm" style="justify-self:start" onclick="addLink('${z.id}')">➕ הוסף שורה</button></div>`;
}
function zoneCard(z,i){
  const isLinks = z.kind==="links";
  const body = isLinks
    ? `${linksFields(z)}
      <div class="two">
        <div><div class="miniLabel">גודל אריח</div><div class="seg">${sizeSeg(z)}</div></div>
        <div><div class="miniLabel">סגנון</div><div class="seg">${styleSeg(z)}</div></div>
      </div>
      <div><div class="miniLabel">צבע</div>${accentPicker(z)}</div>
      <div><div class="miniLabel">אייקון</div>${iconPicker(z)}</div>`
    : `<div class="field"><label>תיאור קצר</label><textarea style="min-height:56px" oninput="setZone('${z.id}','desc',this.value)">${esc(z.desc)}</textarea></div>
      <div class="two">
        <div class="field"><label>טקסט כפתור (CTA)</label><input value="${attr(z.cta)}" oninput="setZone('${z.id}','cta',this.value)"></div>
        <div><div class="miniLabel">גודל אריח</div><div class="seg">${sizeSeg(z)}</div></div>
      </div>
      <div class="two">
        <div><div class="miniLabel">סגנון</div><div class="seg">${styleSeg(z)}</div></div>
        <div><div class="miniLabel">צבע</div>${accentPicker(z)}</div>
      </div>
      <div><div class="miniLabel">אייקון</div>${iconPicker(z)}</div>
      <div><div class="miniLabel">יעד בלחיצה</div><div class="seg">${targetSeg(z)}</div></div>
      ${targetFields(z)}`;
  return `<div class="zone" data-zid="${esc(z.id)}">
    <div class="zoneHead">
      <span class="editingTag">נערך כעת</span>
      <span class="zoneHandle">${iconSvg(z.icon)}</span>
      <input class="zoneName" value="${attr(z.title)}" oninput="setZone('${z.id}','title',this.value)">
      <div class="zoneOps">
        <button class="btn icon sm" onclick="moveZone('${z.id}',-1)" ${i===0?'disabled style=opacity:.35':''}>↑</button>
        <button class="btn icon sm" onclick="moveZone('${z.id}',1)" ${i===data.zones.length-1?'disabled style=opacity:.35':''}>↓</button>
        <button class="btn icon sm danger" onclick="removeZone('${z.id}')">✕</button>
      </div>
    </div>
    <div class="zoneBody">
      ${body}
    </div>
  </div>`;
}

function paletteChips(){
  return PALETTES.map(p=>`<button class="pchip ${data.settings.palette===p.id?'active':''}" title="${p.name}" onclick="applyPalette('${p.id}')">
    <i style="background:${p.heroBase}"></i><i style="background:${p.primary}"></i><i style="background:${p.accent}"></i>
  </button>`).join("");
}

function renderEditor(){
  const s=data.settings,b=data.brand,h=data.hero;
  const ctaTypeSel=(cur,id,onch)=>`<select onchange="${onch}">

   </select>`;

  el.innerHTML=`
  <details class="sec" open>
    <summary>עיצוב ופלטת צבעים</summary>
    <div class="body">
      <div><div class="miniLabel">פלטות מוכנות</div><div class="palette">${paletteChips()}</div></div>
      <div class="two">
        <div class="field"><label>צבע ראשי</label><div class="colorField"><input type="color" value="${attr(s.primary)}" oninput="set('settings.primary',this.value)"><input value="${attr(s.primary)}" oninput="set('settings.primary',this.value)"></div></div>
        <div class="field"><label>צבע משני (אקסנט)</label><div class="colorField"><input type="color" value="${attr(s.accent)}" oninput="set('settings.accent',this.value)"><input value="${attr(s.accent)}" oninput="set('settings.accent',this.value)"></div></div>
      </div>
      <div class="two">
        <div class="field"><label>רקע הדף</label><div class="colorField"><input type="color" value="${attr(s.bg)}" oninput="set('settings.bg',this.value)"><input value="${attr(s.bg)}" oninput="set('settings.bg',this.value)"></div></div>
        <div class="field"><label>רקע הבאנר (Hero)</label><div class="colorField"><input type="color" value="${attr(s.heroBase)}" oninput="set('settings.heroBase',this.value)"><input value="${attr(s.heroBase)}" oninput="set('settings.heroBase',this.value)"></div></div>
      </div>
      <div class="field"><label>מצב תצוגה</label>
        <div class="seg">
          <button class="${s.mode==='light'?'on':''}" onclick="set('settings.mode','light');renderEditor()">בהיר</button>
          <button class="${s.mode==='dark'?'on':''}" onclick="set('settings.mode','dark');renderEditor()">כהה</button>
        </div>
      </div>
    </div>
  </details>

  <details class="sec" open>
    <summary>מיתוג ובאנר</summary>
    <div class="body">
      <div class="field"><label>שם הארגון / המערכת</label><input value="${attr(b.org)}" oninput="set('brand.org',this.value)"></div>
      <div class="two">
        <div class="field"><label>סמל טקסט (אם אין לוגו)</label><input value="${attr(b.logoText)}" oninput="set('brand.logoText',this.value)"></div>
        <div class="field"><label>לוגו</label>
          <label class="btn filebtn sm" style="justify-self:start">${b.logo?'החלפה':'העלאה'}<input type="file" accept="image/*" onchange="uploadLogo(event)"></label>
          ${b.logo?`<button class="btn sm danger" style="justify-self:start" onclick="set('brand.logo','');renderEditor()">הסרת לוגו</button>`:''}
        </div>
      </div>
      <div class="field"><label>כיתוב עליון (Eyebrow)</label><input value="${attr(h.eyebrow)}" oninput="set('hero.eyebrow',this.value)"></div>
      <div class="field"><label>כותרת ברוכים הבאים</label><input value="${attr(h.title)}" oninput="set('hero.title',this.value)"></div>
      <div class="field"><label>טקסט משנה</label><textarea oninput="set('hero.subtitle',this.value)">${esc(h.subtitle)}</textarea></div>
      <div class="field"><label>תמונת באנר (רקע)</label>
        <label class="btn filebtn sm" style="justify-self:start">${h.banner?'החלפת תמונה':'העלאת תמונה'}<input type="file" accept="image/*" onchange="uploadBanner(event)"></label>
        ${h.banner?`<button class="btn sm danger" style="justify-self:start" onclick="set('hero.banner','');renderEditor()">הסרת תמונה</button>`:'<div class="fileNote">בלי תמונה — הבאנר יוצג בצבע רקע + גרדיאנט</div>'}
      </div>
      <div class="two">
        <div class="field"><label>כפתור ראשי — טקסט</label><input value="${attr(h.ctaText)}" oninput="set('hero.ctaText',this.value)"></div>
        <div class="field"><label>כפתור ראשי — פעולה</label>${ctaTypeSel(h.ctaType,'','set(\'hero.ctaType\',this.value);renderEditor()')}</div>
      </div>
      ${h.ctaType==='link'?`<div class="field"><label>כתובת כפתור ראשי</label><input value="${attr(h.ctaUrl)}" oninput="set('hero.ctaUrl',this.value)"></div>`:''}
      <div class="two">
        <div class="field"><label>כפתור משני — טקסט</label><input value="${attr(h.cta2Text)}" oninput="set('hero.cta2Text',this.value)"></div>
        <div class="field"><label>כפתור משני — פעולה</label>${ctaTypeSel(h.cta2Type,'','set(\'hero.cta2Type\',this.value);renderEditor()')}</div>
      </div>
      ${h.cta2Type==='link'?`<div class="field"><label>כתובת כפתור משני</label><input value="${attr(h.cta2Url)}" oninput="set('hero.cta2Url',this.value)"></div>`:''}

  <details class="sec" id="secZones" open>
    <summary>אזורי הלמידה <span class="cnt">${data.zones.length}</span></summary>

        <div class="field"><textarea style="min-height:52px" placeholder="הגדרה" oninput="data.glossary[${i}].def=this.value;autosave();renderPreview()">${esc(g.def)}</textarea></div>
      </div>`).join("")}
      <button class="btn" onclick="addTerm()">＋ הוספת מונח</button>
    </div>
  </details>

  <details class="sec">
    <summary>שאלות ותשובות <span class="cnt">${data.faq.length}</span></summary>
    <div class="body">
      ${data.faq.map((f,i)=>`<div class="pairItem">
        <div class="pairTop"><span>שאלה ${i+1}</span><button class="btn icon sm danger" onclick="removeFaq(${i})">✕</button></div>
        <div class="field"><input value="${attr(f.q)}" placeholder="שאלה" oninput="data.faq[${i}].q=this.value;autosave();renderPreview()"></div>
        <div class="field"><textarea style="min-height:52px" placeholder="תשובה" oninput="data.faq[${i}].a=this.value;autosave();renderPreview()">${esc(f.a)}</textarea></div>
      </div>`).join("")}
      <button class="btn" onclick="addFaq()">＋ הוספת שאלה</button>
    </div>
  </details>

  <details class="sec">
    <summary>כללי</summary>
    <div class="body">
      <div class="field"><label>כותרת תחתונה (Footer)</label><input value="${attr(data.footer)}" oninput="set('footer',this.value)"></div>
      <div class="field"><label>שם קובץ בייצוא</label><input value="${attr(s.fileName)}" oninput="set('settings.fileName',this.value)"></div>
    </div>
  </details>
  `;
  reapplyEditing();
}

/* ============================== MUTATIONS ============================== */
function applyPalette(id){const p=PALETTES.find(x=>x.id===id);if(!p)return;Object.assign(data.settings,{palette:p.id,primary:p.primary,accent:p.accent,mode:p.mode,bg:p.bg,heroBase:p.heroBase});autosave();renderEditor();renderPreview()}
function addZone(){data.zones.push({id:zid(),icon:"star",title:"אזור חדש",desc:"תיאור קצר של האזור.",size:"sm",style:"soft",accent:data.settings.primary,target:{type:"link",url:"",fileName:"",fileData:"",html:""},cta:"פתיחה"});autosave();renderEditor();renderPreview()}
function addLinksZone(){data.zones.push({id:zid(),kind:"links",icon:"tools",title:"קישורים שימושיים",size:"sm",style:"soft",accent:data.settings.primary,links:[{text:"",url:""}]});autosave();renderEditor();renderPreview();toast("בלוק קישורים נוסף")}
function removeZone(id){if(!confirm("להסיר את האזור?"))return;data.zones=data.zones.filter(z=>z.id!==id);autosave();renderEditor();renderPreview()}
function moveZone(id,dir){const i=data.zones.findIndex(z=>z.id===id);const j=i+dir;if(j<0||j>=data.zones.length)return;const a=data.zones;[a[i],a[j]]=[a[j],a[i]];autosave();renderEditor();renderPreview()}
function addTerm(){data.glossary.push({term:"",def:""});autosave();renderEditor();renderPreview()}
function removeTerm(i){data.glossary.splice(i,1);autosave();renderEditor();renderPreview()}
function addFaq(){data.faq.push({q:"",a:""});autosave();renderEditor();renderPreview()}
function removeFaq(i){data.faq.splice(i,1);autosave();renderEditor();renderPreview()}

function uploadLogo(e){readImage(e.target.files[0],d=>{data.brand.logo=d;autosave();renderEditor();renderPreview()})}
function uploadBanner(e){readImage(e.target.files[0],d=>{data.hero.banner=d;autosave();renderEditor();renderPreview()})}
function uploadZoneFile(id,e){readFileAny(e.target.files[0],(d,name)=>{const z=zoneById(id);z.target.fileData=d;z.target.fileName=name;autosave();renderEditor();renderPreview()})}
function clearZoneFile(id){const z=zoneById(id);z.target.fileData="";z.target.fileName="";autosave();renderEditor();renderPreview()}

/* ============================== MODE / IO ============================== */
function setMode(m){document.body.classList.toggle("viewOnly",m==="view");if(m==="view")window.scrollTo(0,0)}
function applyPreviewWidth(){renderPreview()}
function saveToBrowser(){autosave();toast("נשמר בדפדפן ✓")}
function resetData(){if(!confirm("לאפס לתוכן הדוגמה? הנתונים הנוכחיים יימחקו."))return;localStorage.removeItem(STORAGE_KEY);data=clone(defaultData);data.zones.forEach(z=>z.id=zid());renderEditor();renderPreview();toast("אופס לדוגמה")}
function downloadJson(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="learning-center-data.json";a.click();URL.revokeObjectURL(a.href)}
function loadJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{data=mergeDeep(clone(defaultData),JSON.parse(ev.target.result));data.zones.forEach(z=>{if(!z.id)z.id=zid()});autosave();renderEditor();renderPreview();toast("נטען ✓")}catch(err){toast("קובץ לא תקין")}};r.readAsText(f);e.target.value=""}

/* ============================== EXPORT ============================== */
function buildStandalone(){
  const vars={...themeVars(),...heroOverlayVars()};
  const varStr=Object.entries(vars).map(([k,v])=>`${k}:${v}`).join(";")+";--pw:1280px";
  const runtimeData=JSON.stringify(RUNTIME_DATA());
  return `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(data.brand.org)} · מרכז למידה</title>
<style>
:root{color-scheme:${data.settings.mode}}
html,body{margin:0}
body{background:${data.settings.bg}}
${FONT_CSS}
${PAGE_CSS}
</style>
</head>
<body>
<div class="lcRoot" style="${varStr}">
${renderPageHTML()}
</div>
<script>window.__LC__=${runtimeData};<\/script>
<script>${RUNTIME_JS}<\/script>
</body>
</html>`;
}
function exportHtml(){
  const html=buildStandalone();
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=data.settings.fileName||"learning-center.html";a.click();URL.revokeObjectURL(a.href);
  toast("קובץ HTML הופק ✓");
}
function copyHtml(){
  const html=buildStandalone();
  navigator.clipboard.writeText(html).then(()=>toast("HTML הועתק ✓")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=html;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("HTML הועתק ✓");
  });
}

/* ============================== EDITOR <-> PREVIEW LINKING (builder only) ============================== */
let editingZid=null;
function q1(sel){try{return document.querySelector(sel)}catch(e){return null}}
function tileSel(zid){return '#previewHost .lcTile[data-zid="'+CSS.escape(zid)+'"]'}
function cardSel(zid){return '#editorFields .zone[data-zid="'+CSS.escape(zid)+'"]'}
function reapplyEditing(){
  if(!editingZid)return;
  const t=q1(tileSel(editingZid)); if(t)t.classList.add('lc-editing');
  const c=q1(cardSel(editingZid)); if(c)c.classList.add('editing');
}
function markEditing(zid,scrollTile){
  editingZid=zid;
  document.querySelectorAll('#editorFields .zone').forEach(z=>z.classList.toggle('editing',z.dataset.zid===zid));
  document.querySelectorAll('#previewHost .lcTile').forEach(t=>t.classList.toggle('lc-editing',t.dataset.zid===zid));
  if(scrollTile){const t=q1(tileSel(zid));if(t)t.scrollIntoView({behavior:'smooth',block:'center'});}
}
function focusZoneFromTile(zid){
  const sec=document.getElementById('secZones'); if(sec)sec.open=true;
  markEditing(zid,false);
  const card=q1(cardSel(zid)); if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
}
function initLinking(){
  // focus any field of a zone -> highlight + scroll the matching tile in the preview
  document.getElementById('editorFields').addEventListener('focusin',e=>{
    const zone=e.target.closest('.zone[data-zid]');
    if(zone)markEditing(zone.dataset.zid,true);
  });
  // click a tile in the live preview (edit mode only) -> jump the editor to that zone
  document.getElementById('previewHost').addEventListener('click',e=>{
    if(document.body.classList.contains('viewOnly'))return; // full-view: tiles perform their real action
    const tile=e.target.closest('.lcTile[data-zid]');
    if(!tile)return;
    e.preventDefault(); e.stopPropagation();
    focusZoneFromTile(tile.dataset.zid);
  },true);
}

/* ============================== INIT ============================== */
document.getElementById("pageCssHost").textContent=FONT_CSS+PAGE_CSS;
renderEditor();
renderPreview();
initLinking();
</script>
